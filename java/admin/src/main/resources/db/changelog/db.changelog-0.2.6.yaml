databaseChangeLog:
  - changeSet:
      id: drop-image-table
      author: Volodymyr Bushko
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: ${db-schema}
            tableName: image
      changes:
        - dropTable:
            schemaName: ${db-schema}
            tableName: image
  - changeSet:
      id: drop-face-table
      author: Volodymyr Bushko
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: ${db-schema}
            tableName: face
      changes:
        - dropTable:
            schemaName: ${db-schema}
            tableName: face
